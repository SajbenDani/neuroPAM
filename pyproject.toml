[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vae-harmonization"
version = "2.1.0"
description = "Minimum-displacement affine harmonization of multi-site functional connectivity with a label-protected subspace"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dániel Sajben", email = "sajben.dani@gmail.com" }, { name = "Luca Szegletes" }]
keywords = ["neuroimaging", "harmonization", "optimal transport", "fMRI", "functional connectivity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "h5py>=3.9",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "neuroCombat>=0.2.12",
    "pyriemann==0.10",
]

[project.urls]
Repository = "https://github.com/SajbenDani/neuroPAM"

[project.optional-dependencies]
preprocess = ["nilearn>=0.10", "nibabel>=5.0", "tqdm>=4.65", "requests>=2.31"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
vae-harmonize = "vae_harmonization.run_vae_harmonization:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::sklearn.exceptions.ConvergenceWarning",
]
