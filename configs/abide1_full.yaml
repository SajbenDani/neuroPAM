# ABIDE-I, 17 sites, C-PAC / CC200 (200 ROIs, 19,900 edges), N = 778.
# These are the paper's headline hyper-parameters.  The dataset entry in
# src/vae_harmonization/data_registry.py supplies paths, site names, hub site
# and covariate sources; this file only overrides VAEConfig fields.
#
#   python -m vae_harmonization.run_vae_harmonization --dataset abide1_full            # uses these defaults
#   python -m vae_harmonization.run_vae_harmonization --config-yaml configs/abide1_full.yaml
dataset_name: abide1_full

# representation
pca_dim: 100
latent_dim: 64
encoder_dims: [512, 256]
decoder_dims: [256, 512]

# training
batch_size: 64
max_epochs: 300
patience: 30
lr: 0.001
weight_decay: 0.0001
grad_clip_norm: 1.0
beta_final: 0.1
beta_warmup_epochs: 50
free_bits: 0.125
lambda_recon: 1.0
lambda_site: 0.0        # no site-adversarial term
lambda_bio: 0.0         # no label term

# harmonizer
bio_svm_C: 1.0
min_cov_samples: 10     # sites below this get a mean shift only
ridge: 1.0e-6

# evaluation
n_cv_folds: 10
seed: 42
